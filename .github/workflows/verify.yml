name: Verify

on:
  push:
    branches: [ main, "batch/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Required job identities remain verify / gateway-windows. Both installations and
# both test executions are in the SAME required job, fail-closed on either red.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24 action
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js minimum-verified baseline
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 Node24 action
        with:
          node-version-file: ".nvmrc"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 Node24 action
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Assert baseline Node runtime matches .nvmrc
        run: |
          expected="$(tr -d '\r\n' < .nvmrc)"
          actual="$(node --version)"
          printf 'NODE_VERSION_EXPECTED=v%s\nNODE_VERSION_ACTUAL=%s\n' "$expected" "$actual"
          test "$actual" = "v$expected"

      - name: Run verification gates at .nvmrc
        run: python3 scripts/verify_all.py

      - name: Set up pinned Node LTS from reviewed source file
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 Node24 action
        with:
          node-version-file: ".node-lts-version"

      - name: Assert pinned Node runtime matches .node-lts-version
        run: |
          expected="$(tr -d '\r\n' < .node-lts-version)"
          actual="$(node --version)"
          printf 'NODE_VERSION_EXPECTED=v%s\nNODE_VERSION_ACTUAL=%s\n' "$expected" "$actual"
          test "$actual" = "v$expected"

      - name: Run verification gates at reviewed pinned LTS
        run: python3 scripts/verify_all.py

  gateway-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24 action
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js minimum-verified baseline
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 Node24 action
        with:
          node-version-file: ".nvmrc"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 Node24 action
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Assert baseline Node runtime matches .nvmrc
        shell: pwsh
        run: |
          $expected = (Get-Content -LiteralPath '.nvmrc' -Raw).Trim()
          $actual = (node --version).Trim()
          "NODE_VERSION_EXPECTED=v$expected"
          "NODE_VERSION_ACTUAL=$actual"
          if ($actual -cne "v$expected") { throw "NODE_VERSION_MISMATCH" }

      - name: Run Channel Gateway core tests at .nvmrc
        run: |
          node --version
          python -m pytest scripts/tests/test_channel_gateway_core.py -v -rfEP

      - name: Set up pinned Node LTS from reviewed source file
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 Node24 action
        with:
          node-version-file: ".node-lts-version"

      - name: Assert pinned Node runtime matches .node-lts-version
        shell: pwsh
        run: |
          $expected = (Get-Content -LiteralPath '.node-lts-version' -Raw).Trim()
          $actual = (node --version).Trim()
          "NODE_VERSION_EXPECTED=v$expected"
          "NODE_VERSION_ACTUAL=$actual"
          if ($actual -cne "v$expected") { throw "NODE_VERSION_MISMATCH" }

      - name: Run Channel Gateway core tests at reviewed pinned LTS
        run: |
          node --version
          python -m pytest scripts/tests/test_channel_gateway_core.py -v -rfEP
